device: cuda
iterations: 500  # Total number of training iterations
log_root: logs/pacman_rl

env:
  layout_file: layouts/train/small_open.txt
  num_envs: 64  # Number of parallel environments to run for data collection
  seed: 0
  randomize_spawn: true
  min_spawn_dist: 5
  action_space_n: 5
  max_steps: 300  # Maximum steps per episode to prevent infinite loops
  timeout_penalty: -75.0
  ghost:
    num_ghosts: 1
    policy: chase_stochastic
    epsilon: 0.4  # Epsilon (As in epsilon-greedy) for stochasticity of ghost behavior
  power_pellet:
    enabled: false
    frightened_duration: 30
  reward:
    pellet: 5.0
    power_pellet: 5.0
    ghost_eaten: 10.0
    death: -20.0
    win: 150.0
    step_penalty: -0.03  # Small penalty to encourage shorter solutions

train:
  num_steps_per_env: 128  # Number of steps to collect per environment before updating
  save_interval: 100
  logger: tensorboard
  obs_groups:
    actor: [policy]
    critic: [policy]
  algorithm:
    class_name: PPO
    num_learning_epochs: 4
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01  # Encourage exploration in discrete action space
    learning_rate: 0.0003
    max_grad_norm: 1.0
    optimizer: adam
    use_clipped_value_loss: true
    schedule: adaptive
    desired_kl: 0.01
    normalize_advantage_per_mini_batch: false
    rnd_cfg: null
    symmetry_cfg: null
  actor:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: pacman_rl.discrete.CategoricalDistribution
      num_categories: 5
  critic:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: false
