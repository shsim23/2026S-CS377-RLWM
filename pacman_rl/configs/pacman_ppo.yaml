device: cuda
iterations: 4000  # Total number of training iterations
log_root: logs/pacman_rl

env:
  layout_file: layouts/train/small_open.txt
  num_envs: 64  # Number of parallel environments to run for data collection
  seed: 42
  randomize_spawn: true
  min_spawn_dist: 5
  action_space_n: 5
  max_steps: 700  # Maximum steps per episode to prevent infinite loops
  timeout_penalty: -50.0  # Penalty for episodes that end due to timeout
  ghost:
    num_ghosts: 1
    policy: chase_stochastic
    epsilon: 0.4  # Epsilon (As in epsilon-greedy) for stochasticity of ghost behavior
    speed_ratio: 0.6  # Ratio of ghost speed to pacman speed (1.0 means same speed, <1.0 means slower ghosts)
  power_pellet:
    enabled: false
    frightened_duration: 30
  reward:
    pellet: 10.0
    power_pellet: 10.0
    ghost_eaten: 20.0
    death: -100.0
    win: 200.0
    sparse_remaining_pellet_penalty: -0.0  # Penalty for each remaining pellet at the end of an episode
    dense_remaining_pellet_ratio_penalty: -0.0  # Penalty per remaining pellet ratio (remaining_pellets / total_pellets)

world_model:
  use_wm: true  # false = train PPO on the ground-truth env; true = train PPO from WM imagined transitions
  checkpoint: checkpoints/dreamer_wm/small_open_mix12_newrwd_modelB_12m/best.pt
  deterministic_latent: false
  continue_threshold: 0.5
  reward_source: reward_head  # reward_head | decoded_rules
  log_reward_sources: true

  # Top-level ablation switch for uncertainty-aware WM-RL. When false and
  # use_wm=true, train vanilla PPO on imagined WM rollouts without confidence
  # weighting or uncertainty-triggered truncation.
  use_uncertainty_aware_methods: true

  # Self-ensemble uncertainty from repeated stochastic WM inference.
  self_ensemble_inferences: 5  # Number of self-ensemble inferences
  self_ensemble_component_weights:  # Relative weighting of different components for when computing uncertainty
    pacman_position: 1.0
    ghost_positions: 0.5
    food_mask: 1.0
    power_timer: 0.0
  running_mean_momentum: 0.99  # Momentum for normalizing self-ensemble uncertainty estimates

  # Sigmoid confidence-weighted PPO updates.
  confidence_weight_ppo: true
  confidence_alpha: 1.0  # confidence_alpha=1.0 is recommended.
  confidence_weight_scale: 2.0

  # Adaptive imagined-rollout truncation.
  adaptive_rollout_truncation: true
  self_ensemble_threshold: 2.0  # Cutoff for adaptive rollout truncation

train:
  num_steps_per_env: 128  # Number of steps to collect per environment before updating
  save_interval: 200  # Save checkpoint every N iterations
  logger: tensorboard
  obs_groups:
    actor: [policy]
    critic: [policy]
  algorithm:
    class_name: PPO
    num_learning_epochs: 4
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01  # Encourage exploration in discrete action space
    learning_rate: 0.0003
    max_grad_norm: 1.0
    optimizer: adam
    use_clipped_value_loss: true
    schedule: adaptive
    desired_kl: 0.01
    normalize_advantage_per_mini_batch: false
    rnd_cfg: null
    symmetry_cfg: null
  actor:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: pacman_rl.discrete.CategoricalDistribution
      num_categories: 5
  critic:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: false
