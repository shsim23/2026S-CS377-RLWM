world_model:
  state_dim: 901
  latent_dim: 128
  gru_hidden: 256
  hidden_dim: 256
  action_emb_dim: 32
  num_ensemble_members: 1   # ensemble disabled; single model for current WM training

  # v11+ — CNN encoder reshapes the 901-D state vector into a 5-channel
  # 21×21 grid (walls, food, pacman one-hot, ghosts multi-hot, power timer)
  # before convolution. Captures local update rules (e.g. food[5,7] vanishes
  # when pacman steps onto (5,7)) that the flat MLP encoder had to learn
  # from scratch. Set to "mlp" to reproduce v0–v10c.
  encoder_type: "cnn"

  batch_size: 64
  seq_length: 50
  burnin: 5                 # legacy fixed burnin (used if burnin_min == burnin_max)
  burnin_min: 0             # train-time burnin sampled uniformly in [burnin_min, burnin_max]
  burnin_max: 5
  learning_rate: 3.0e-4
  weight_decay: 0.0
  optimizer: adam
  grad_clip: 0.5            # was 1.0; tightened to combat post-1k-step divergence observed in v0

  # v2 settings — v1 (β=3, pw=20) confirmed to make L_done dominate L_latent
  # 55×, warping the encoder for done at cost of dynamics. v2 mirrors v0's
  # head-loss magnitude while keeping the stronger β_var to prevent collapse.
  beta_reward: 1.0
  beta_done: 1.0
  beta_var: 0.1             # was 0.01 in v0; up 10x to fight latent collapse (dead_dims 22/128 in v0)
  target_std: 0.15          # v3 used 0.3 — drift kept going (target > natural latent std ~0.05).
                            # v4 lowers further so ReLU(target - std) can saturate to 0 and
                            # stop nudging the encoder once enough variance is achieved.
  pos_weight_done: 5.0      # mild positive class boost — full balance (~20×) was too aggressive

  # v7 — DynamicStateHead aux loss. Predicts dynamic state (pacman/ghost pos,
  # food mask, power timer) from latent z. Replaces v5's FoodCountHead which
  # collapsed to mean (low-variance scalar target). 460-dim multi-task target
  # makes mean-collapse much costlier and forces encoder to preserve all
  # reward/done-relevant state info.
  beta_dynamic_state: 1.0

  # v9 — L_count_delta explicit constraint. The signed sigmoid-sum delta from
  # (encoder-count at t) - (dynamics-count at t+1) must equal the true
  # food_eaten count. Without this, per-cell BCE (~0.028 in v8.2) dominates
  # while the reward gradient is split 1/441 across cells, leaving the count
  # mis-calibrated at the boundary (±4 RMSE → 39% FN on food_eaten=1).
  beta_count_delta: 0.0     # v9 found this insufficient; FoodEatenHead instead

  # v10 — FoodEatenHead. Dedicated binary classifier on (z_t, z_next) that
  # predicts P(food eaten this transition). Reward is now derived from this
  # head, bypassing the sum-of-441-sigmoids that the v8.2 diagnostic showed
  # loses the 0/1 signal in count noise (±4 RMSE → 39% FN, 8% sign-error).
  # Two BCE terms: encoder-encoder (clean teaching) and encoder-dynamics
  # (matches K-step rollout inference).
  beta_food_eaten: 1.0

  max_train_steps: 50000
  eval_every: 500
  patience: 15              # was 10; eval noise is high, more patience needed
  eval_seed: 0              # fixed seed for val trajectory sampling — comparable across steps

  k_step: 10
  n_eval_trajectories: 100

  threshold_latent_mse: 0.05
  threshold_reward_mse: 0.10
  threshold_done_err: 0.10

  wandb_project: "cs377-team4"
  wandb_entity: null
