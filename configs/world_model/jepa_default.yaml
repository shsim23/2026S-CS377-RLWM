world_model:
  state_dim: 901
  latent_dim: 128
  gru_hidden: 256
  hidden_dim: 256
  action_emb_dim: 32
  num_ensemble_members: 5

  batch_size: 64
  seq_length: 50
  burnin: 5
  learning_rate: 3.0e-4
  weight_decay: 0.0
  optimizer: adam
  grad_clip: 1.0

  beta_reward: 1.0
  beta_done: 1.0
  beta_var: 0.01

  max_train_steps: 50000
  eval_every: 500
  patience: 10

  k_step: 10
  n_eval_trajectories: 100

  threshold_latent_mse: 0.05
  threshold_reward_mse: 0.10
  threshold_done_err: 0.10
