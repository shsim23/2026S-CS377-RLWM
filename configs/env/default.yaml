env:
  layout_file: "layouts/train/medium_classic.txt"
  ghost:
    num_ghosts: 1
    policy: "chase_stochastic"
    epsilon: 0.2
    speed_ratio: 1.0
    personality: "homogeneous"
  power_pellet:
    enabled: false
    frightened_duration: 30
  reward:
    pellet: 1.0
    power_pellet: 5.0
    ghost_eaten: 10.0
    death: -10.0
    win: 50.0
    sparse_remaining_pellet_penalty: 0.0
    dense_remaining_pellet_ratio_penalty: 0.0
  episode:
    max_steps: 500
  render_mode: null
